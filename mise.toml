# mise configuration for the challenge-me repo.
# https://mise.jdx.dev/

[tools]
# Matches `settings.jvm.jdk.version: 25` in module.yaml. Having JAVA_HOME already on 25
# means the Kotlin Toolchain reuses this JDK instead of provisioning its own via Foojay.
java = "temurin-25"
# Standalone Kotlin compiler — ONLY used to run scripts/dev-update.main.kts (`mise run dev-update`).
# The module itself is built by the Kotlin Toolchain (`./kotlin`), which provisions its own compiler;
# keep this version matched to `settings.kotlin.version` in module.yaml so the script and the module
# are compiled by the same Kotlin release.
kotlin = { version = "2.4.10", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }

[tasks.test]
description = "Run all tests"
# Two flags, both load-bearing:
#   --include-classes "*"  overrides the JUnit Console Launcher's default class-name filter
#                          (^(Test.*|.+[.$]Test.*|.*Tests?)$). Without it only the 26
#                          utility classes ending in `Test` are discovered and the 197
#                          problem/lesson classes are silently skipped (116 tests, not 319).
#   --exclude-classes      replaces Gradle's `exclude("other/concurrency/*")`; those lesson
#                          files are deliberately racy/deadlocking demos.
run = './kotlin test --include-classes "*" --exclude-classes "other.concurrency.*"'

[tasks.build]
description = "Compile all code (does NOT run tests — use `mise run test` for that)"
run = "./kotlin build"

[tasks.test-one]
description = 'Run a single problem, e.g. `mise run test-one leetcode.backtracking.I0039combinationSum`'
# The trailing `*` is load-bearing: tests live in the `@Nested inner class Solution`, whose
# filter identity is `...I0039combinationSum/Solution` (nested classes use `/`, not `.`).
# Wildcards match across both separators, so `${usage_pattern}*` reaches the nested class.
usage = 'arg "<pattern>" help="Class-name prefix: a problem, a category, or any package prefix"'
run = './kotlin test --include-classes "${usage_pattern}*"'

[tasks.clean]
description = "Delete build output and caches"
run = "./kotlin clean"

[tasks.db-up]
description = "Start the Postgres container for the database/isolation examples (fixed host port 5433)"
run = "docker compose up -d --wait"

[tasks.db-down]
description = "Stop the Postgres container (add -v manually to also wipe the data volume)"
run = "docker compose down"

[tasks.isolation]
description = "Run the transaction-isolation demos in src/database/isolation (needs `mise run db-up` first)"
# --main-class is required: the module has two main functions (Main.kt and this one), and
# `./kotlin run` defaults to the auto-detected Main.kt.
run = "./kotlin run --main-class org.example.database.isolation.IsolationDemosKt"

[tasks.dev-update]
description = "Update the Kotlin Toolchain and every pinned dependency version; --dry-run to only list them"
# The Kotlin Toolchain has no dependency-update command of its own, so scripts/dev-update.main.kts
# resolves the coordinates in module.yaml against Maven Central's maven-metadata.xml.
#
# The script is run by the standalone Kotlin compiler from [tools].kotlin, NOT by the Kotlin
# Toolchain: the Toolchain cannot run a .kts from inside a project (`./kotlin run <script>`
# silently ignores the path and runs the module's Main.kt instead).
#
# JAVA_OPTS quiets the .main.kts script host's Maven resolver, which otherwise logs an INFO line
# per cached artifact while it resolves the script's @file:DependsOn (kotlinx-coroutines-core).
#
# Updates everything by default; extra args are passed through to the script:
#   mise run dev-update -- --dry-run   list the available updates, write nothing
env.JAVA_OPTS = "-Dorg.slf4j.simpleLogger.defaultLogLevel=warn"
run = "kotlin scripts/dev-update.main.kts"
