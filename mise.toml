# mise configuration for the challenge-me repo.
# https://mise.jdx.dev/

[tools]
# Matches `settings.jvm.jdk.version: 25` in module.yaml. Having JAVA_HOME already on 25
# means the Kotlin Toolchain reuses this JDK instead of provisioning its own via Foojay.
java = "temurin-25"
# Standalone Kotlin compiler — not needed by any task any more (dev-update used to be a .kts run
# by it; it is now the compiled `update-script` module). Kept for ad-hoc `kotlin foo.main.kts`
# scripting, and still bumped automatically with `settings.kotlin.version` in module.yaml so an
# ad-hoc script is compiled by the same Kotlin release as the project.
kotlin = { version = "2.4.20", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }

[tasks.test]
description = "Run all tests"
# Two flags, both load-bearing:
#   --include-classes "*"  overrides the JUnit Console Launcher's default class-name filter
#                          (^(Test.*|.+[.$]Test.*|.*Tests?)$). Without it only the 26
#                          utility classes ending in `Test` are discovered and the 197
#                          problem/lesson classes are silently skipped (116 tests, not 319).
#   --exclude-classes      replaces Gradle's `exclude("other/concurrency/*")`; those lesson
#                          files are deliberately racy/deadlocking demos.
#   --include-module       required as soon as the project has more than one module: the Toolchain
#                          refuses a test filter that is not scoped to a module (and errors on a
#                          module with no matching tests, which `update-script` has none of).
run = './kotlin test --include-module challenge-me --include-classes "*" --exclude-classes "other.concurrency.*"'

[tasks.build]
description = "Compile all code (does NOT run tests — use `mise run test` for that)"
run = "./kotlin build"

[tasks.test-one]
description = 'Run a single problem, e.g. `mise run test-one leetcode.backtracking.I0039combinationSum`'
# The trailing `*` is load-bearing: tests live in the `@Nested inner class Solution`, whose
# filter identity is `...I0039combinationSum/Solution` (nested classes use `/`, not `.`).
# Wildcards match across both separators, so `${usage_pattern}*` reaches the nested class.
usage = 'arg "<pattern>" help="Class-name prefix: a problem, a category, or any package prefix"'
run = './kotlin test --include-module challenge-me --include-classes "${usage_pattern}*"'

[tasks.clean]
description = "Delete build output and caches"
run = "./kotlin clean"

[tasks.db-up]
description = "Start the Postgres container for the database/isolation examples (fixed host port 5433)"
run = "docker compose up -d --wait"

[tasks.db-down]
description = "Stop the Postgres container (add -v manually to also wipe the data volume)"
run = "docker compose down"

[tasks.isolation]
description = "Run the transaction-isolation demos in src/database/isolation (needs `mise run db-up` first)"
# --main-class is required: the module has two main functions (Main.kt and this one), and
# `./kotlin run` defaults to the auto-detected Main.kt.
run = "./kotlin run --main-class org.example.database.isolation.IsolationDemosKt"

[tasks.dev-update-build]
description = "Build the dev-update binary (scripts/update-script) — Kotlin/Native, one binary per arch"
# Links build/tasks/_update-script_linkLinuxX64Debug/update-script.kexe (and the Arm64 twin), then
# copies the x64 one next to its sources as scripts/update-script.kexe — a stable path that does
# not move when the Toolchain renames its task directories, and survives `mise run clean`.
run = [
  "./kotlin build -m update-script",
  "cp build/tasks/_update-script_linkLinuxX64Debug/update-script.kexe scripts/update-script.kexe",
]

[tasks.dev-update]
description = "Update the Kotlin Toolchain and every pinned dependency version; --dry-run to only list them"
# The Kotlin Toolchain has no dependency-update command of its own, so scripts/update-script
# resolves the coordinates in every module.yaml against Maven Central's maven-metadata.xml.
#
# `depends` rebuilds the binary first; the Toolchain no-ops when nothing in the module changed,
# so the usual run costs one up-to-date check. Extra args are passed through to the binary:
#   mise run dev-update -- --dry-run   list the available updates, write nothing
depends = ["dev-update-build"]
run = "./scripts/update-script.kexe"
