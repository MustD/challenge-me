product: jvm/app

# Default Kotlin Toolchain layout: main sources in src/, test sources in test/.
# (Resources, if ever needed, would go in resources/ and testResources/.)

# kotlin-test and the JUnit 5 runner are configured automatically (settings.junit defaults
# to junit-5, which pulls org.jetbrains.kotlin:kotlin-test-junit5 at settings.kotlin.version).
test-dependencies:
  - org.junit.jupiter:junit-jupiter:6.1.2          # explicit: the harness uses @Nested directly
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  - org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0

settings:
  kotlin:
    version: 2.4.10
  jvm:
    jdk:
      version: 25
    release: 25
    test:
      junitPlatformVersion: 6.1.2                  # keep aligned with junit-jupiter above
